# TEMPLATE — media automation stack (sanitized; replace all placeholders).
# One shared network lets the managers reach Prowlarr and the download
# client by container name. One shared /data mount enables hardlink imports.
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./prowlarr/config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - media-stack

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./sonarr/config:/config
      - /data/media:/data/media
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks:
      - media-stack

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./radarr/config:/config
      - /data/media:/data/media
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - media-stack

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./lidarr/config:/config
      - /data/media:/data/media
    ports:
      - "8686:8686"
    restart: unless-stopped
    networks:
      - media-stack

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent/config:/config
      - /data/media/downloads:/downloads
    ports:
      - "8090:8080"   # WebUI (host port differs from other services)
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    networks:
      - media-stack

networks:
  media-stack:
    name: media-stack_default
