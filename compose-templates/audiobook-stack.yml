# TEMPLATE — audiobook pipeline (sanitized; replace all placeholders).
# Listenarr (manager) imports into the SAME folder Audiobookshelf (player)
# serves. Verify "same folder" from inside both containers, not the host.
services:
  listenarr:
    image: ghcr.io/listenarrs/listenarr:canary-1.3.17   # pinned on purpose
    container_name: listenarr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=America/New_York
    volumes:
      - ./listenarr/config:/app/config        # note: keep config/ffmpeg/ffprobe here
      - /data/media:/data/media               # parent mount -> hardlinks work
    ports:
      - "4545:4545"
    restart: unless-stopped
    networks:
      - media-stack                            # reach qBittorrent by name

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      - TZ=America/New_York
    volumes:
      - /data/media/audiobooks:/audiobooks
      - ./audiobookshelf/config:/config
      - ./audiobookshelf/metadata:/metadata
    ports:
      - "13378:80"
    restart: unless-stopped

networks:
  media-stack:
    external: true
    name: media-stack_default

# Operating notes (from the build):
# - Listenarr settings that matter: root folder /data/media/audiobooks,
#   naming {Author}/{Title}, completed-file action "hardlink/copy",
#   download client category dedicated to Listenarr, remove-completed = none.
# - Audiobookshelf: enable the library folder watcher; new imports appear
#   on the shelf automatically, no scheduled scan needed.
